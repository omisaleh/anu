<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign Up</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}body{background:#f3e8e3;color:#171313}.page{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.hero{position:relative;flex:1 1 auto;min-height:0;background:#3e241e;overflow:hidden}.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 25%}.top{position:absolute;top:12px;left:16px;background:#050505;color:white;font-weight:bold;font-size:13px;letter-spacing:1px;padding:5px 13px}.panel{flex:0 0 auto;background:#f3e8e3;padding:0 16px 12px}.band{margin:0 -16px;background:#482a22;color:#fff;text-align:center;padding:10px 8px 8px;font-size:12px}.button{display:block;width:calc(100% - 144px);min-width:250px;margin:0 auto 10px;border:0;border-radius:28px;background:#fff;color:#111;font-size:18px;font-weight:bold;padding:13px 8px;cursor:pointer}.desc{font-size:13px;line-height:1.35;margin:0 0 8px}.steps{border:1px dashed #cbbab2;border-radius:6px;padding:4px;display:grid;gap:2px}.step{display:flex;align-items:center;gap:10px;min-height:34px;background:#faf5f2;padding:6px 8px;font-size:11px;font-weight:bold}.num{font-size:11px;color:#6d5a53}.step:first-child{border-radius:4px 4px 0 0}.step:last-child{border-radius:0 0 4px 4px}@media(min-width:700px){.page{max-width:540px;margin:0 auto}.hero{flex:1 1 auto}.panel{padding-bottom:12px}}
</style>
</head>
<body>
<div class="page">
  <section class="hero" aria-label="Featured photo">
    <img src="pic.jpg" alt="">
    <div class="top">SIGN UP</div>
  </section>
  <main class="panel">
    <div class="band">Click on Sign Up Button and Continue Register.. 👇👇</div>
    <button class="button" type="button" onclick="window.location.href='https://tinyurl.com/2bk58yc2'">👉 Free Sign Up 👈</button>
    <p class="desc">You just need to answer 2/3 Question then it ask your name and email. that's it.<br>Age Submit 40+</p>
    <div class="steps">
      <div class="step"><span class="num">01</span><span>Answer 2/3 Questions</span></div>
      <div class="step"><span class="num">02</span><span>Name &amp; Email</span></div>
      <div class="step"><span class="num">03</span><span>Age Submit 40+</span></div>
    </div>
  </main>
</div>
</body>
</html>
