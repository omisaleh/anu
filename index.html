<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <meta name="robots" content="noindex">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Keep the same Project URL and anon/public key as set.html.
  const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
  const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

  async function redirectVisitor() {
    try {
      if (SUPABASE_URL.includes("PASTE_") || SUPABASE_ANON_KEY.includes("PASTE_")) {
        throw new Error("Supabase configuration is missing.");
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data, error } = await client
        .from("redirect_settings")
        .select("target_url")
        .eq("id", 1)
        .single();

      if (error) throw error;

      const destination = new URL(data.target_url);
      if (!["https:", "http:"].includes(destination.protocol)) {
        throw new Error("The saved destination URL is invalid.");
      }

      // Redirect without showing an intermediate message or fallback link.
      window.location.replace(destination.href);
    } catch (error) {
      // Leave the page blank if redirecting fails.
      console.error("Redirect error:", error);
    }
  }

  redirectVisitor();
</script>
</body>
</html>
