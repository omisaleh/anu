<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://krdkbmcnjhroxxlolior.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7-Tcp9q16brUb84cHQMb0A_N8MSK8pY";

  async function redirectVisitor() {
    // Open a blank tab immediately during the click to avoid popup blockers.
    const newTab = window.open("about:blank", "_blank");

    if (!newTab) {
      alert("Please allow pop-ups for this website and try again.");
      return;
    }

    try {
      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      const { data, error } = await client
        .from("redirect_settings")
        .select("target_url")
        .eq("id", 1)
        .single();

      if (error) throw error;

      const destination = new URL(data.target_url);

      if (!["https:", "http:"].includes(destination.protocol)) {
        throw new Error("The saved destination URL is invalid.");
      }

      newTab.location.replace(destination.href);
    } catch (error) {
      console.error("Redirect error:", error);
      newTab.close();
      alert("Unable to open the signup page. Please try again later.");
    }
  }

  // Change "signupButton" to your actual button's ID if needed.
  document
    .getElementById("signupButton")
    .addEventListener("click", redirectVisitor);
</script>
