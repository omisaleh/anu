<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const SUPABASE_URL = "https://krdkbmcnjhroxxlolior.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_7-Tcp9q16brUb84cHQMb0A_N8MSK8pY";

    async function redirect() {
      try {
        const supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

        const { data, error } = await supabase
          .from("redirect_settings")
          .select("target_url")
          .eq("id", 1)
          .single();

        if (error || !data?.target_url) return;

        const url = new URL(data.target_url);

        if (url.protocol !== "https:" && url.protocol !== "http:") return;

        window.location.replace(url.href);
      } catch (_) {
        // Keep the page blank if the redirect cannot be completed.
      }
    }

    redirect();
  </script>
</body>
</html>
